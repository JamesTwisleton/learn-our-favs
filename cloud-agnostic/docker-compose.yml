# Local development stack for the cloud-agnostic version.
# Stands up plain, provider-neutral equivalents of the managed services:
#   Postgres  ~ RDS / Spanner (schema is written to the dialect intersection, ADR 0009)
#   MinIO     ~ S3 / GCS (claim-check media uploads, ADR 0017)
#   Redis     ~ ElastiCache / Memorystore (role cache, video + top-tracks cache)
#   Kafka     ~ the one broker that is identical on both clouds (ADR 0018)
#   MongoDB   ~ DocumentDB / self-managed Mongo (band note content, ADR 0014)
#   OpenSearch~ managed OpenSearch (catalogue "add any song" search)
#
#   docker compose up -d          start everything
#   docker compose run --rm flyway migrate   apply db/migrations
name: learn-my-faves-cloud-agnostic

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lmf
      POSTGRES_PASSWORD: lmf
      POSTGRES_DB: lmf
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmf"]
      interval: 5s
      timeout: 3s
      retries: 10

  flyway:
    image: flyway/flyway:10-alpine
    command: -connectRetries=20 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/lmf
      FLYWAY_USER: lmf
      FLYWAY_PASSWORD: lmf
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lmf
      MINIO_ROOT_PASSWORD: lmf-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  mongodata:
  miniodata:
